name: Set up Senera Node
description: Restore the npm cache and install the locked workspace dependencies.

inputs:
  node-version:
    description: Node.js major version to install.
    required: false
    default: "22"
  install-electron:
    description: Download Electron during npm installation for jobs that execute or package the desktop application.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Restore Windows Electron downloads
      if: runner.os == 'Windows' && inputs.install-electron == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
    - name: Install locked dependencies with Electron
      if: inputs.install-electron == 'true'
      run: npm ci --no-audit --no-fund --prefer-offline
      shell: bash
    - name: Install locked dependencies without Electron
      if: inputs.install-electron != 'true'
      run: npm ci --no-audit --no-fund --prefer-offline
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

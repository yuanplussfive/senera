# Compose follows the last fully verified stable release. Production deployments
# should override both values with immutable registry digests for controlled rollout.
x-senera-image: &senera-image ${SENERA_IMAGE:-ghcr.io/yuanplussfive/senera:latest}
x-senera-sandbox-image: &senera-sandbox-image ${SENERA_SANDBOX_IMAGE:-ghcr.io/yuanplussfive/senera:sandbox-runtime-latest}

x-senera-runtime: &senera-runtime
  image: *senera-image
  pull_policy: always
  environment:
    SENERA_WORKSPACE_ROOT: /data
    AGENT_CONFIG_PATH: /data/senera.config.json
    SENERA_SERVER_HOST: 0.0.0.0
    SENERA_SERVER_PORT: 8787
    # Add the exact browser Origin used to access Senera, including its port.
    SENERA_ALLOWED_ORIGINS: "http://localhost:8787,http://127.0.0.1:8787"
    SENERA_ALLOW_INSECURE_HTTP: "true"
    SENERA_PUBLIC_WS_URL: ""
    # Set this once in the host environment or the gitignored .env file.
    # When empty, Senera persists a local key in /data/.senera instead.
    SENERA_CONFIG_SECRET_KEY: "${SENERA_CONFIG_SECRET_KEY:-}"
    SENERA_SANDBOX_WORKER_ENDPOINT: /run/senera-sandbox/worker.sock
    SENERA_RUNTIME_IMAGE_REFERENCE: *senera-image
    # Change these three values before the first start. They remain
    # authoritative when the container is restarted.
    SENERA_ADMIN_LOGIN_NAME: "admin"
    SENERA_ADMIN_DISPLAY_NAME: "Senera Administrator"
    SENERA_ADMIN_PASSWORD: "replace-with-a-strong-password"
  volumes:
    - senera-data:/data
    - senera-sandbox-control:/run/senera-sandbox
    - senera-sandbox-staging:/tmp

services:
  sandbox-runtime:
    image: *senera-sandbox-image
    pull_policy: always
    entrypoint: ["node", "--version"]
    command: []
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  senera:
    <<: *senera-runtime
    ports:
      - "8787:8787"
    depends_on:
      sandbox-worker:
        condition: service_healthy
    restart: unless-stopped

  sandbox-worker:
    image: *senera-image
    pull_policy: always
    entrypoint: ["node", "Dist/Apps/SandboxWorker.js"]
    command: []
    user: "0:0"
    environment:
      SENERA_SANDBOX_WORKER_ENDPOINT: /run/senera-sandbox/worker.sock
      # Docker controls access through this dedicated named volume. The main
      # service runs as node, while the Worker remains root for Docker Engine.
      SENERA_SANDBOX_WORKER_ENDPOINT_MODE: "0666"
      SENERA_DOCKER_ENGINE_ENDPOINT: /run/docker-engine.sock
      SENERA_DOCKER_SANDBOX_PROVIDER: auto
      SENERA_DOCKER_SANDBOX_IMAGE: *senera-sandbox-image
      SENERA_DOCKER_SANDBOX_PULL_POLICY: never
      SENERA_SANDBOX_WORKSPACE_KIND: volume
      SENERA_SANDBOX_WORKSPACE_SOURCE: senera-data
      SENERA_SANDBOX_COPY_SOURCE_ROOTS: '["/app","/data","/tmp"]'
    volumes:
      - /var/run/docker.sock:/run/docker-engine.sock
      - senera-data:/data:ro
      - senera-sandbox-control:/run/senera-sandbox
      - senera-sandbox-staging:/tmp
    network_mode: none
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('node:fs');process.exit(fs.statSync(process.env.SENERA_SANDBOX_WORKER_ENDPOINT).isSocket()?0:1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  senera-data:
  senera-sandbox-control:
  senera-sandbox-staging:

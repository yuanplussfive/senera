name: Verify

env:
  npm_config_cache: .npm-cache

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every local verification script after the normal gates.
        required: false
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit Message Gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            to="$PR_HEAD_SHA"
          else
            from="$PUSH_BEFORE"
            to="$PUSH_AFTER"

            if [[ ! "$from" =~ ^0+$ ]]; then
              git merge-base --is-ancestor "$from" "$to"
            fi
          fi

          if [[ "$from" =~ ^0+$ ]]; then
            echo "arguments=--last --verbose" >> "$GITHUB_OUTPUT"
          else
            echo "arguments=--from=$from --to=$to --verbose" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'pull_request'
        env:
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --import tsx Scripts/VerifyPullRequestTitle.ts
      - run: npm run quality.commits -- ${{ steps.range.outputs.arguments }}

  build-artifacts:
    name: Build Verification Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run policy.verify
      - run: npm run quality.baml
      - run: npm run build
      - run: npm --workspace senera-frontend run build
      - name: Upload verification build
        uses: actions/upload-artifact@v6
        with:
          name: verification-build
          path: |
            Dist
            Frontend/dist
          if-no-files-found: error
          retention-days: 1

  fast:
    name: Fast Gate
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json') }}-
      - name: Download verification build
        uses: actions/download-artifact@v7
        with:
          name: verification-build
          path: .
      - id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "arguments=" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            to="$PR_HEAD_SHA"
          else
            from="$PUSH_BEFORE"
            to="$PUSH_AFTER"

            if [[ ! "$from" =~ ^0+$ ]]; then
              git merge-base --is-ancestor "$from" "$to"
            fi
          fi

          if [[ "$from" =~ ^0+$ ]]; then
            echo "arguments=" >> "$GITHUB_OUTPUT"
          else
            echo "arguments=--from=$from --to=$to" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run quality.lint
      - run: npm run quality.format -- ${{ steps.range.outputs.arguments }}
      - run: npm run test.frontend.static
      - run: npm run test.integration
      - run: npm run verify.suite -- workspace core integration e2e release

  browser-e2e:
    name: Chromium Browser E2E
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Download verification build
        uses: actions/download-artifact@v7
        with:
          name: verification-build
          path: .
      - id: playwright
        name: Resolve Playwright version
        shell: bash
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install cached Chromium
        run: npm run test.e2e.web.setup
        timeout-minutes: 8
      - run: npm run test.e2e.web.run
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-e2e-diagnostics
          path: |
            .cache/playwright-results
            .cache/playwright-report
          if-no-files-found: ignore

  platform-windows:
    name: Windows Platform Smoke
    needs: build-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
        with:
          install-electron: "true"
      - name: Download verification build
        uses: actions/download-artifact@v7
        with:
          name: verification-build
          path: .
      - run: npm run test.e2e.desktop.run
      - run: npm run verify.suite -- platform

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run test.coverage.frontend
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/frontend
          if-no-files-found: error
      - run: npm run test.coverage.backend
      - uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: coverage/backend
          if-no-files-found: error
      - run: npm run quality.coverage.ratchet

  all-local:
    name: All Local Verifications
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full_suite
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - run: npm run verify.all

name: Setup gVisor
description: Install and register the official gVisor runsc OCI runtime for Docker Engine verification.

runs:
  using: composite
  steps:
    - name: Install official runsc release
      shell: bash
      run: |
        set -euo pipefail
        architecture="$(uname -m)"
        release_root="https://storage.googleapis.com/gvisor/releases/release/latest/${architecture}"
        archive_name="gvisor.tar.zstd"
        checksum_name="${archive_name}.sha512"
        temporary_root="$(mktemp -d)"
        cleanup() {
          rm -rf "$temporary_root"
        }
        trap cleanup EXIT

        curl --fail --location --retry 3 --retry-all-errors --output "$temporary_root/$archive_name" "$release_root/$archive_name"
        curl --fail --location --retry 3 --retry-all-errors --output "$temporary_root/$checksum_name" "$release_root/$checksum_name"
        (
          cd "$temporary_root"
          sha512sum --check "$checksum_name"
        )
        sudo tar --zstd --extract --file "$temporary_root/$archive_name" --directory /usr/local/bin
        test -x /usr/local/bin/runsc
        test -d /usr/local/bin/gvisor-bin
        sudo /usr/local/bin/runsc install
        sudo systemctl restart docker
        docker info --format '{{json .Runtimes}}' | grep --quiet '"runsc"'

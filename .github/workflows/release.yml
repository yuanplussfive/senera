name: Product Release

env:
  npm_config_cache: .npm-cache

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to rebuild, or the missing tag to recover.
        required: true
        type: string
      recovery_sha:
        description: Exact merged release commit to fully verify before recovering a missing tag.
        required: false
        type: string

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: product-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recovery-source:
    name: Validate Release Recovery Source
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
          fetch-depth: 0
      - name: Require a recoverable release tag at its merged manifest commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          git merge-base --is-ancestor "$RECOVERY_SHA" "origin/${RELEASE_BRANCH}"

          release_version="$(node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync("Build/Release/ReleasePleaseManifest.json", "utf8")); console.log(manifest["."]);')"
          test "v${release_version}" = "$RELEASE_TAG"

          manifest_commit="$(git log -1 --format=%H -- Build/Release/ReleasePleaseManifest.json)"
          test "$manifest_commit" = "$RECOVERY_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RECOVERY_SHA"
          fi

  recovery-core:
    name: Reverify Release Source
    needs:
      - recovery-source
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm run policy.verify
      - run: npm run quality.baml
      - run: npm run build
      - run: npm run quality.lint
      - run: npm run quality.format.full
      - run: npm run test.frontend.static
      - run: npm run test.integration
      - run: npm run verify.suite -- workspace core integration e2e release

  recovery-browser-e2e:
    name: Reverify Release Chromium E2E
    needs:
      - recovery-source
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
      - uses: ./.github/actions/setup-node
      - id: playwright
        name: Resolve Playwright version
        shell: bash
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install cached Chromium
        run: npm run test.e2e.web.setup
        timeout-minutes: 8
      - run: npm run test.e2e.web
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-chromium-e2e-diagnostics
          path: |
            .cache/playwright-results
            .cache/playwright-report
          if-no-files-found: ignore

  recovery-windows:
    name: Reverify Release Windows Platform
    needs:
      - recovery-source
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
      - uses: ./.github/actions/setup-node
        with:
          install-electron: "true"
      - run: npm run build
      - run: npm --workspace senera-frontend run build
      - run: npm run test.e2e.desktop.run
      - run: npm run verify.suite -- platform

  recovery-coverage:
    name: Reverify Release Coverage
    needs:
      - recovery-source
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
      - uses: ./.github/actions/setup-node
      - run: npm run test.coverage.frontend
      - run: npm run test.coverage.backend
      - run: npm run quality.coverage.ratchet

  recovery-tag:
    name: Recover Verified Release Tag
    needs:
      - recovery-core
      - recovery-browser-e2e
      - recovery-windows
      - recovery-coverage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.recovery_sha != '' &&
      needs.recovery-core.result == 'success' &&
      needs.recovery-browser-e2e.result == 'success' &&
      needs.recovery-windows.result == 'success' &&
      needs.recovery-coverage.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.recovery.outputs.tag_name }}
      source_sha: ${{ steps.recovery.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_sha }}
          fetch-depth: 0
      - id: tag-state
        name: Inspect recovered release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RECOVERY_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: release
        if: steps.tag-state.outputs.exists != 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: Build/Release/ReleasePleaseConfig.json
          manifest-file: Build/Release/ReleasePleaseManifest.json
          skip-github-pull-request: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - id: recovery
        name: Require recovered release tag
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          TAG_EXISTS: ${{ steps.tag-state.outputs.exists }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"

          if [ "$TAG_EXISTS" != "true" ]; then
            test "$RELEASE_CREATED" = "true"
            test "$RELEASE_TAG" = "$EXPECTED_TAG"
          fi

          echo "tag_name=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${RECOVERY_SHA}" >> "$GITHUB_OUTPUT"

  release-please:
    name: Prepare Version Release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release-state.outputs.current_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: release-state
        name: Inspect Current Release State
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_version="$(node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync("Build/Release/ReleasePleaseManifest.json", "utf8")); console.log(manifest["."]);')"
          current_tag="v${current_version}"

          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${current_tag}" >/dev/null 2>&1; then
            echo "skip_pull_request=false" >> "$GITHUB_OUTPUT"
          else
            current_version_sha="$(git log -1 --format=%H -- Build/Release/ReleasePleaseManifest.json)"
            if [ -z "$current_version_sha" ] || [ "$current_version_sha" != "$VERIFIED_SHA" ]; then
              echo "::error::Current manifest release ${current_tag} belongs to ${current_version_sha:-unknown}, but this run verified ${VERIFIED_SHA}. Dispatch Product Release with release_tag=${current_tag} and recovery_sha=${current_version_sha} to reverify and recover that exact release commit."
              exit 1
            fi
            echo "skip_pull_request=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Git tag ${current_tag} is missing; release PR creation is disabled until the current manifest release is recovered."
          fi
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: Build/Release/ReleasePleaseConfig.json
          manifest-file: Build/Release/ReleasePleaseManifest.json
          skip-github-pull-request: ${{ steps.release-state.outputs.skip_pull_request }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Require current manifest release before opening the next release PR
        if: >-
          steps.release-state.outputs.skip_pull_request == 'true' &&
          steps.release.outputs.release_created != 'true'
        env:
          CURRENT_TAG: ${{ steps.release-state.outputs.current_tag }}
        run: |
          echo "::error::Release Please manifest points to ${CURRENT_TAG}, but that GitHub release/tag is missing. Create or recover ${CURRENT_TAG}, then rerun Product Release."
          exit 1
      - name: Enable auto-merge for the generated release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t release_pull_requests < <(
            gh pr list \
              --repo "$REPOSITORY" \
              --base "$BASE_BRANCH" \
              --state open \
              --label "autorelease: pending" \
              --limit 2 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-please--")) | .number'
          )

          case "${#release_pull_requests[@]}" in
            0)
              exit 0
              ;;
            1)
              gh pr merge "${release_pull_requests[0]}" --repo "$REPOSITORY" --auto --squash
              ;;
            *)
              echo "Expected at most one generated release pull request, found ${#release_pull_requests[@]}." >&2
              exit 1
              ;;
          esac

  metadata:
    name: Verify Release Metadata
    needs:
      - release-please
      - recovery-tag
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (
          inputs.recovery_sha == '' ||
          needs.recovery-tag.outputs.tag_name != ''
        )) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      desktop_artifact_name: ${{ steps.release.outputs.desktop_artifact_name }}
      desktop_artifact_path: ${{ steps.release.outputs.desktop_artifact_path }}
      container_version_tag: ${{ steps.release.outputs.container_version_tag }}
      container_minor_tag: ${{ steps.release.outputs.container_minor_tag }}
      sandbox_runtime_source_image: ${{ steps.release.outputs.sandbox_runtime_source_image }}
      sandbox_runtime_distribution_id: ${{ steps.release.outputs.sandbox_runtime_distribution_id }}
      sandbox_runtime_version_tag: ${{ steps.release.outputs.sandbox_runtime_version_tag }}
      sandbox_runtime_target: ${{ steps.release.outputs.sandbox_runtime_target }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      RELEASE_TAG: ${{ needs.recovery-tag.outputs.tag_name || inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-node
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          SENERA_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SENERA_RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: npx tsx Build/ProductReleaseInfo.ts
      - name: Require recovered release source
        if: needs.recovery-tag.outputs.source_sha != ''
        shell: bash
        env:
          SENERA_RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SENERA_RELEASE_RECOVERY_SHA: ${{ needs.recovery-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SENERA_RELEASE_SHA" = "$SENERA_RELEASE_RECOVERY_SHA"
      - name: Require verified release source
        if: needs.recovery-tag.outputs.source_sha == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENERA_RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SENERA_RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          SENERA_RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SENERA_VERIFY_WORKFLOW: verify.yml
        run: npx tsx Scripts/VerifyProductReleaseSource.ts

  desktop:
    name: Build Windows Installer
    needs:
      - metadata
    if: always() && needs.metadata.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: ./.github/actions/setup-node
        with:
          install-electron: "true"
      - run: npm run desktop.pack
      - name: Verify differential update assets
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ needs.metadata.outputs.desktop_artifact_path }}
        run: |
          $required = @(
            $env:INSTALLER_PATH,
            "$($env:INSTALLER_PATH).blockmap",
            "Release/latest.yml"
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Electron update assets are missing: $($missing -join ', ')"
          }
      - name: Generate the verified product update manifest
        env:
          SENERA_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SENERA_RELEASE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: >-
          npm run generate.update-manifest --
          --output Release/senera-update.json
          --installer "${{ needs.metadata.outputs.desktop_artifact_path }}"
          --repository "${{ github.repository }}"
          --server-url "${{ github.server_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.desktop_artifact_name }}
          path: |
            ${{ needs.metadata.outputs.desktop_artifact_path }}
            ${{ needs.metadata.outputs.desktop_artifact_path }}.blockmap
            Release/latest.yml
            Release/senera-update.json
          if-no-files-found: error

  container-build:
    name: Build Container Candidate
    needs:
      - metadata
    if: always() && needs.metadata.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      reference: ${{ steps.image.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/senera
          tags: |
            type=raw,value=sha-${{ needs.metadata.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          sbom: true
          pull: true
          cache-from: type=gha,scope=senera-release-container
          cache-to: type=gha,mode=max,scope=senera-release-container,ignore-error=true

  sandbox-runtime-build:
    name: Build Sandbox Runtime Candidate
    needs:
      - metadata
    if: always() && needs.metadata.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reference: ${{ steps.image.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/senera
          tags: |
            type=raw,value=sandbox-runtime-sha-${{ needs.metadata.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.sandbox_runtime_version_tag }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sandbox
          build-args: |
            SENERA_SANDBOX_SOURCE_IMAGE=${{ needs.metadata.outputs.sandbox_runtime_source_image }}
            SENERA_SANDBOX_DISTRIBUTION_ID=${{ needs.metadata.outputs.sandbox_runtime_distribution_id }}
            SENERA_SANDBOX_DISTRIBUTION_VERSION=${{ needs.metadata.outputs.sandbox_runtime_version_tag }}
            SENERA_SANDBOX_TARGET=${{ needs.metadata.outputs.sandbox_runtime_target }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          sbom: true
          pull: true
          cache-from: type=gha,scope=senera-release-sandbox-runtime
          cache-to: type=gha,mode=max,scope=senera-release-sandbox-runtime,ignore-error=true

  container-smoke:
    name: Verify Container Runtime
    needs:
      - metadata
      - container-build
      - sandbox-runtime-build
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.container-build.result == 'success' &&
      needs.sandbox-runtime-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTAINER_HEALTH_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/setup-gvisor
      - name: Start and probe isolated container deployment
        shell: bash
        env:
          IMAGE: ${{ needs.container-build.outputs.reference }}@${{ needs.container-build.outputs.digest }}
          SANDBOX_IMAGE: ${{ needs.sandbox-runtime-build.outputs.reference }}@${{ needs.sandbox-runtime-build.outputs.digest }}
          COMPOSE_PROJECT_NAME: senera-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          cleanup() {
            local status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps || true
              docker compose logs || true
            fi
            docker compose down --volumes --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker pull "$IMAGE"
          docker pull "$SANDBOX_IMAGE"
          export SENERA_IMAGE="$IMAGE"
          export SENERA_SANDBOX_IMAGE="$SANDBOX_IMAGE"
          docker compose up --detach --wait --wait-timeout "$CONTAINER_HEALTH_TIMEOUT_SECONDS" --pull never
          container_id="$(docker compose ps --quiet senera)"
          test -n "$container_id"
          runtime_uid="$(docker exec "$container_id" sh -c "sed -n 's/^Uid:[[:space:]]*\\([0-9]*\\).*/\\1/p' /proc/1/status")"
          node_uid="$(docker exec "$container_id" id -u node)"
          if [ "$runtime_uid" = "0" ] || [ "$runtime_uid" != "$node_uid" ]; then
            echo "Container PID 1 must run as node (runtime_uid=$runtime_uid, node_uid=$node_uid)." >&2
            exit 1
          fi

          docker compose exec -T --user node senera node Dist/Scripts/VerifyDockerNativeSqlite.js
          docker compose exec -T --user node senera node Dist/Scripts/VerifyDockerSkillWrite.js

  container:
    name: Publish Verified Release
    needs:
      - metadata
      - desktop
      - container-build
      - sandbox-runtime-build
      - container-smoke
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.desktop.result == 'success' &&
      needs.container-build.result == 'success' &&
      needs.sandbox-runtime-build.result == 'success' &&
      needs.container-smoke.result == 'success'
    runs-on: ubuntu-latest
    environment: release-stable
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.desktop_artifact_name }}
          path: ${{ runner.temp }}/release-assets
      - name: Attach verified installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_ASSET_ROOT: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          mapfile -d '' release_assets < <(find "$RELEASE_ASSET_ROOT" -type f -print0)
          if [ "${#release_assets[@]}" -ne 4 ]; then
            echo "Expected four verified desktop release assets, found ${#release_assets[@]}." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --repo "$REPOSITORY" --clobber
      - id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/senera
          tags: |
            type=raw,value=${{ needs.metadata.outputs.container_version_tag }}
            type=raw,value=${{ needs.metadata.outputs.container_minor_tag }}
            type=raw,value=latest
      - id: sandbox-image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/senera
          tags: |
            type=raw,value=sandbox-runtime-${{ needs.metadata.outputs.sandbox_runtime_version_tag }}
            type=raw,value=sandbox-runtime-latest
      - name: Promote verified container digest
        shell: bash
        env:
          SOURCE_IMAGE: ${{ needs.container-build.outputs.reference }}@${{ needs.container-build.outputs.digest }}
          TARGET_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail

          tag_arguments=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_arguments+=(--tag "$tag")
            fi
          done <<< "$TARGET_TAGS"

          if [ "${#tag_arguments[@]}" -eq 0 ]; then
            echo "No stable container tags were generated." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_arguments[@]}" "$SOURCE_IMAGE"

      - name: Promote verified sandbox runtime digest
        shell: bash
        env:
          SOURCE_IMAGE: ${{ needs.sandbox-runtime-build.outputs.reference }}@${{ needs.sandbox-runtime-build.outputs.digest }}
          TARGET_TAGS: ${{ steps.sandbox-image.outputs.tags }}
        run: |
          set -euo pipefail

          tag_arguments=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_arguments+=(--tag "$tag")
            fi
          done <<< "$TARGET_TAGS"

          if [ "${#tag_arguments[@]}" -eq 0 ]; then
            echo "No stable sandbox runtime tags were generated." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_arguments[@]}" "$SOURCE_IMAGE"
      - name: Publish draft as the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest

# 单服务模式：一个容器跑完 Senera + 沙箱 Worker，编排直观，适合内网单机部署。
# 注意：此模式需要 root 运行并直挂 Docker socket，安全边界弱于多容器拆分方案
# （主进程以 root 运行，嵌入的沙箱 Worker 才能访问 Docker Engine）。
# 浏览器同源访问自动放行；公网/多租户环境请前置 HTTPS 反向代理。
services:
  senera:
    image: ${SENERA_IMAGE:-ghcr.io/yuanplussfive/senera:latest}
    container_name: senera
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # 浏览器同源 Origin 与 Host 自动匹配；跨域客户端请在配置文件中声明 AllowedOrigins
      # 单服务模式显式门控：主进程以 root 运行，嵌入的沙箱 Worker 才能访问 Docker Engine
      SENERA_CONTAINER_RUNTIME_USER: "root"
      # 主进程与沙箱挂载共享同一个可配置的 Linux 工作区命名空间
      SENERA_WORKSPACE_ROOT: "${SENERA_WORKSPACE_ROOT:-/data}"
      # 首次启动必填，之后重启仍以此为准
      SENERA_ADMIN_LOGIN_NAME: "yuan"
      SENERA_ADMIN_DISPLAY_NAME: "Senera Administrator"
      SENERA_ADMIN_PASSWORD: "114514114514114514"
      # 建议固定密钥；留空则在工作区/.senera 持久化本地 key
      SENERA_CONFIG_SECRET_KEY: "${SENERA_CONFIG_SECRET_KEY:-}"
      # 可选：覆盖沙箱运行时镜像与拉取策略；留空则使用内置分发契约版本
      SENERA_DOCKER_SANDBOX_IMAGE: "${SENERA_DOCKER_SANDBOX_IMAGE:-}"
      SENERA_DOCKER_SANDBOX_PULL_POLICY: "${SENERA_DOCKER_SANDBOX_PULL_POLICY:-}"
    volumes:
      - senera-data:${SENERA_WORKSPACE_ROOT:-/data}
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # 显式固定卷名：嵌入的沙箱 Worker 默认挂载同名卷（SENERA_SANDBOX_WORKSPACE_SOURCE）
  senera-data:
    name: senera-data

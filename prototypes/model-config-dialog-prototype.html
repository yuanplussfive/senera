<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模型配置弹窗原型</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #edf0ef;
        color: #1e2524;
        --page: #edf0ef;
        --panel: #ffffff;
        --panel-soft: #f7f9f8;
        --text: #202725;
        --muted: #68716f;
        --faint: #909997;
        --line: #dfe5e3;
        --line-strong: #cbd4d1;
        --accent: #257d6e;
        --accent-soft: #e6f3ef;
        --accent-line: #a9dacd;
        --danger: #a9473d;
        --shadow: 0 24px 70px rgba(24, 38, 34, 0.18), 0 4px 14px rgba(24, 38, 34, 0.08);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
      }
      body {
        overflow: hidden;
        background: var(--page);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #83cbbc;
        outline-offset: 2px;
      }
      input::placeholder {
        color: #a0aaa7;
      }

      #stage {
        min-height: 100svh;
      }
      .prototype-scene {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        background: var(--page);
      }

      .app-shell {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 100svh;
        color: var(--text);
      }
      .app-sidebar {
        padding: 28px 18px;
        border-right: 1px solid var(--line);
        background: #f5f7f6;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 12px 32px;
        font-weight: 680;
        letter-spacing: 0.01em;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        color: #fff;
        background: #253b36;
        font-size: 13px;
      }
      .nav-label {
        margin: 0 12px 9px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 7px;
        color: #697470;
        font-size: 13px;
      }
      .nav-item + .nav-item {
        margin-top: 3px;
      }
      .nav-item.active {
        color: #1f302b;
        background: #e5efeb;
        font-weight: 620;
      }
      .nav-icon {
        width: 16px;
        color: #80908a;
        text-align: center;
      }

      .app-main {
        min-width: 0;
        padding: 30px 38px 100px;
      }
      .page-topline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .page-eyebrow {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .page-title {
        margin: 0;
        font-size: 23px;
        letter-spacing: -0.02em;
      }
      .page-description {
        max-width: 520px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .ghost-button,
      .primary-button {
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        white-space: nowrap;
      }
      .primary-button {
        border-color: #1f2926;
        background: #1f2926;
        color: #fff;
      }
      .model-table {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
      }
      .table-head,
      .table-row {
        display: grid;
        grid-template-columns: minmax(180px, 1.2fr) minmax(140px, 0.8fr) 112px 84px;
        gap: 18px;
        align-items: center;
        padding: 0 20px;
      }
      .table-head {
        min-height: 42px;
        border-bottom: 1px solid var(--line);
        background: #fafbfb;
        color: var(--faint);
        font-size: 11px;
      }
      .table-row {
        min-height: 68px;
        border-bottom: 1px solid #eef1f0;
        font-size: 13px;
      }
      .table-row:last-child {
        border-bottom: 0;
      }
      .model-name {
        font-weight: 650;
      }
      .model-id {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .table-status {
        color: var(--accent);
      }
      .table-action {
        color: var(--muted);
        text-align: right;
      }

      .modal-layer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px 22px 88px;
      }
      .modal-scrim {
        position: absolute;
        inset: 0;
        background: rgba(29, 38, 36, 0.49);
      }
      .model-dialog {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: min(100%, 660px);
        max-height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        animation: dialog-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes dialog-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .dialog-header {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        flex-shrink: 0;
        padding: 22px 24px 16px;
      }
      .dialog-heading {
        min-width: 0;
        flex: 1;
      }
      .dialog-kicker {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .dialog-title {
        margin: 0;
        color: var(--text);
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .dialog-helper {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .close-button {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        margin: -4px -5px 0 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #89928f;
        font-size: 21px;
        line-height: 1;
      }
      .close-button:hover {
        color: var(--text);
        background: #f0f3f2;
      }
      .mode-switch {
        display: inline-flex;
        flex: 0 0 auto;
        align-self: center;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f7f9f8;
      }
      .mode-switch button {
        min-height: 27px;
        padding: 0 9px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }
      .mode-switch button.is-active {
        background: #fff;
        color: var(--text);
        box-shadow: 0 1px 4px rgba(27, 43, 38, 0.1);
        font-weight: 650;
      }
      .dialog-body {
        min-height: 0;
        overflow: auto;
        padding: 0 24px 22px;
        scrollbar-color: #c6cfcc transparent;
        scrollbar-width: thin;
      }
      .dialog-body::-webkit-scrollbar {
        width: 9px;
      }
      .dialog-body::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: #c6cfcc;
        background-clip: padding-box;
      }
      .dialog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        padding: 13px 24px 20px;
        border-top: 1px solid #edf1ef;
        background: #fff;
      }
      .footer-left {
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .footer-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .dialog-footer .ghost-button,
      .dialog-footer .primary-button {
        min-height: 34px;
      }
      .danger-button {
        border: 0;
        background: transparent;
        color: var(--danger);
        font-size: 12px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }
      .field-label {
        display: flex;
        align-items: baseline;
        gap: 4px;
        color: #5e6865;
        font-size: 12px;
      }
      .required {
        color: #cf5148;
      }
      .text-input {
        width: 100%;
        height: 38px;
        padding: 0 11px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
      }
      .text-input:hover {
        border-color: #b8c5c0;
      }
      .text-input:focus {
        border-color: var(--accent);
      }
      .text-input[readonly] {
        background: #f5f7f6;
        color: #6c7672;
      }
      .field-note {
        margin: -2px 0 0;
        color: var(--faint);
        font-size: 11px;
        line-height: 1.45;
      }
      .disclosure {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #4c5854;
        font-size: 12px;
      }
      .disclosure:hover {
        color: var(--accent);
      }
      .chevron {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
        transition: transform 160ms ease;
      }
      [data-advanced="true"] .chevron {
        transform: rotate(225deg) translate(-1px, -1px);
      }
      .advanced-content {
        display: none;
        margin-top: 13px;
      }
      [data-advanced="true"] .advanced-content {
        display: block;
      }
      .section-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fbfcfc;
      }
      .section-card + .section-card {
        margin-top: 11px;
      }
      .section-title {
        margin: 0;
        color: #4f5b57;
        font-size: 12px;
        font-weight: 650;
      }
      .section-description {
        margin: 4px 0 11px;
        color: var(--faint);
        font-size: 11px;
        line-height: 1.4;
      }
      .chip-group {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: #fff;
        color: #4d5955;
        font-size: 12px;
      }
      .chip:hover {
        border-color: var(--accent-line);
        color: var(--accent);
      }
      .chip.is-selected {
        border-color: var(--accent-line);
        background: var(--accent-soft);
        color: #176b5d;
        font-weight: 650;
      }
      .token-block + .token-block {
        margin-top: 15px;
      }
      .token-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .token-label {
        color: #5c6763;
        font-size: 12px;
      }
      .token-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .token-preset {
        min-height: 27px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: #5e6865;
        font-size: 11px;
      }
      .token-preset:hover {
        border-color: var(--accent-line);
        color: var(--accent);
      }
      .token-input {
        height: 36px;
      }
      .toast {
        position: absolute;
        z-index: 5;
        left: 50%;
        bottom: 88px;
        transform: translateX(-50%);
        padding: 9px 13px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 7px;
        background: #1f2926;
        color: #fff;
        box-shadow: 0 9px 24px rgba(17, 28, 25, 0.22);
        font-size: 12px;
        animation: toast-in 180ms ease-out both;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translate(-50%, 7px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      [data-dialog-open="false"] .modal-layer {
        display: none;
      }
      [data-dialog-open="false"] .toast {
        bottom: 28px;
      }
      .reopen-button {
        position: absolute;
        right: 28px;
        bottom: 28px;
        z-index: 2;
        display: none;
      }
      [data-dialog-open="false"] .reopen-button {
        display: inline-flex;
      }
      .mode-only-edit {
        display: none;
      }
      [data-mode="edit"] .mode-only-edit {
        display: inline;
      }
      [data-mode="edit"] .mode-only-create {
        display: none;
      }
      .mode-only-edit.block {
        display: none;
      }
      [data-mode="edit"] .mode-only-edit.block {
        display: block;
      }
      [data-mode="edit"] .mode-only-create.block {
        display: none;
      }

      /* Direction 1: compact, form-first. */
      .variant-focused .model-dialog {
        width: min(100%, 626px);
      }
      .variant-focused .dialog-header {
        align-items: center;
        padding-bottom: 14px;
      }
      .variant-focused .dialog-kicker {
        display: none;
      }
      .variant-focused .dialog-helper {
        margin-top: 4px;
      }
      .variant-focused .dialog-body {
        padding-top: 3px;
      }
      .variant-focused .section-card {
        background: #fff;
      }

      /* Direction 2: explicit zones, with a quieter information hierarchy. */
      .variant-sections .model-dialog {
        width: min(100%, 690px);
      }
      .variant-sections .dialog-header {
        padding: 24px 28px 18px;
        border-bottom: 1px solid #edf1ef;
      }
      .variant-sections .dialog-body {
        padding: 18px 28px 24px;
      }
      .variant-sections .dialog-footer {
        padding: 14px 28px 22px;
      }
      .variant-sections .form-grid {
        grid-template-columns: 142px minmax(0, 1fr);
        gap: 13px 18px;
      }
      .variant-sections .field {
        grid-template-columns: subgrid;
        grid-column: 1 / -1;
        align-items: center;
      }
      .variant-sections .field-label {
        min-height: 38px;
      }
      .variant-sections .field-note {
        grid-column: 2;
        margin-top: -5px;
      }
      .variant-sections .disclosure {
        margin-top: 21px;
      }
      .variant-sections .advanced-content {
        margin-top: 15px;
      }
      .variant-sections .section-card {
        padding: 16px;
        background: #fff;
      }
      .variant-sections .advanced-content {
        border-top: 1px solid #eef2f0;
        padding-top: 15px;
      }

      /* Direction 3: dense editor surface with a section rail. */
      .variant-workbench .model-dialog {
        width: min(100%, 870px);
      }
      .variant-workbench .dialog-header {
        padding: 20px 22px 15px;
        border-bottom: 1px solid var(--line);
      }
      .variant-workbench .dialog-body {
        display: grid;
        grid-template-columns: 164px minmax(0, 1fr);
        gap: 24px;
        padding: 0 22px 20px;
      }
      .variant-workbench .dialog-rail {
        padding-top: 22px;
      }
      .rail-caption {
        margin: 0 0 9px;
        color: var(--faint);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .rail-item {
        display: block;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #697470;
        text-align: left;
        font-size: 12px;
      }
      .rail-item + .rail-item {
        margin-top: 2px;
      }
      .rail-item.active {
        background: var(--accent-soft);
        color: #176b5d;
        font-weight: 650;
      }
      .rail-summary {
        margin-top: 24px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfc;
      }
      .rail-summary strong {
        display: block;
        color: var(--text);
        font-size: 12px;
      }
      .rail-summary span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .variant-workbench .dialog-form {
        min-width: 0;
        padding: 22px 0 0;
      }
      .variant-workbench .form-grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }
      .variant-workbench .field-note {
        margin-top: -2px;
      }
      .variant-workbench .disclosure {
        margin-top: 19px;
      }
      .variant-workbench .section-card {
        background: #fff;
      }
      .variant-workbench .dialog-footer {
        padding: 13px 22px 17px;
      }
      .variant-workbench .footer-left {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .save-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d39b38;
      }
      .variant-workbench [data-mode="edit"] .save-dot {
        background: #4aaf8f;
      }

      @media (max-width: 820px) {
        .app-shell {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        .app-sidebar {
          padding: 20px 10px;
        }
        .brand {
          justify-content: center;
          margin: 0 0 28px;
        }
        .brand span:last-child,
        .nav-label,
        .nav-item span:last-child {
          display: none;
        }
        .nav-item {
          justify-content: center;
          padding: 0;
        }
        .app-main {
          padding: 26px 22px 100px;
        }
        .table-head,
        .table-row {
          grid-template-columns: minmax(150px, 1fr) 112px 80px;
        }
        .table-head > :nth-child(2),
        .table-row > :nth-child(2) {
          display: none;
        }
        .variant-workbench .model-dialog {
          width: min(100%, 700px);
        }
      }
      @media (max-width: 640px) {
        .app-shell {
          display: block;
        }
        .app-sidebar {
          display: none;
        }
        .app-main {
          padding: 24px 16px 100px;
        }
        .page-topline {
          display: block;
        }
        .page-topline > .ghost-button {
          margin-top: 14px;
        }
        .table-head,
        .table-row {
          grid-template-columns: minmax(140px, 1fr) 80px;
          padding: 0 14px;
        }
        .table-head > :nth-child(2),
        .table-row > :nth-child(2),
        .table-head > :nth-child(3),
        .table-row > :nth-child(3) {
          display: none;
        }
        .modal-layer {
          padding: 14px 10px 78px;
        }
        .model-dialog {
          border-radius: 14px;
        }
        .dialog-header {
          padding: 18px 17px 13px;
          flex-wrap: wrap;
        }
        .dialog-heading {
          order: 1;
          width: calc(100% - 38px);
        }
        .close-button {
          order: 0;
          margin-left: auto;
        }
        .mode-switch {
          order: 2;
          width: 100%;
        }
        .mode-switch button {
          flex: 1;
        }
        .dialog-body {
          padding: 0 17px 18px;
        }
        .dialog-footer {
          padding: 11px 17px 14px;
        }
        .footer-left {
          display: none;
        }
        .footer-actions {
          width: 100%;
        }
        .footer-actions > button {
          flex: 1;
        }
        .form-grid,
        .variant-sections .form-grid {
          grid-template-columns: 1fr;
        }
        .variant-sections .field {
          display: grid;
          gap: 7px;
        }
        .variant-sections .field-note {
          grid-column: auto;
          margin-top: -2px;
        }
        .variant-workbench .dialog-body {
          display: block;
          padding: 0 17px 18px;
        }
        .variant-workbench .dialog-rail {
          display: none;
        }
        .variant-workbench .dialog-form {
          padding-top: 18px;
        }
        .variant-workbench .dialog-footer {
          padding: 11px 17px 14px;
        }
        .reopen-button {
          right: 16px;
          bottom: 18px;
        }
      }

      /* Required prototype picker. Keep this harness chrome unchanged. */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }

      .proto-picker-item {
        position: relative; /* sits above the highlight */
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }

      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }

      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }

      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }

      .proto-picker[data-position="top"] {
        bottom: auto;
        top: 24px;
      }
    </style>
  </head>
  <body>
    <main id="stage"></main>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">聚焦</button>
      <button class="proto-picker-item">分区</button>
      <button class="proto-picker-item">工作台</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <script>
      const modelData = {
        id: "gpt-5.5",
        name: "GPT-5.5",
        context: "128K",
        input: "128K",
        output: "16K",
      };

      function appBackground() {
        return `
        <div class="app-shell">
          <aside class="app-sidebar">
            <div class="brand"><span class="brand-mark">S</span><span>Senera</span></div>
            <p class="nav-label">设置</p>
            <div class="nav-item"><span class="nav-icon">◼</span><span>常规</span></div>
            <div class="nav-item active"><span class="nav-icon">◇</span><span>模型与供应商</span></div>
            <div class="nav-item"><span class="nav-icon">↗</span><span>渠道</span></div>
            <div class="nav-item"><span class="nav-icon">⚙</span><span>高级</span></div>
          </aside>
          <section class="app-main">
            <div class="page-topline">
              <div>
                <p class="page-eyebrow">设置 / 模型与供应商</p>
                <h2 class="page-title">模型管理</h2>
                <p class="page-description">统一管理供应商连接和可用模型。模型配置只保存当前供应商下的请求参数。</p>
              </div>
              <button class="ghost-button" data-action="open">添加模型</button>
            </div>
            <div class="model-table">
              <div class="table-head"><span>模型</span><span>供应商</span><span>状态</span><span></span></div>
              <div class="table-row"><div><div class="model-name">GPT-4o</div><div class="model-id">gpt-4o</div></div><div>OpenAI Compatible</div><div class="table-status">已启用</div><div class="table-action">编辑</div></div>
              <div class="table-row"><div><div class="model-name">Claude 3.7 Sonnet</div><div class="model-id">claude-3-7-sonnet</div></div><div>Anthropic</div><div class="table-status">已启用</div><div class="table-action">编辑</div></div>
              <div class="table-row"><div><div class="model-name">Qwen 3</div><div class="model-id">qwen3-235b-a22b</div></div><div>DashScope</div><div class="table-status">草稿</div><div class="table-action">编辑</div></div>
            </div>
          </section>
        </div>`;
      }

      function modeSwitch() {
        return `<div class="mode-switch" aria-label="Prototype mode">
        <button data-mode="create" class="is-active">添加模型</button>
        <button data-mode="edit">编辑模型</button>
      </div>`;
      }

      function fieldMarkup(type, label, placeholder, editValue, required = false, readOnlyEdit = false) {
        const readOnly = readOnlyEdit ? " data-edit-readonly" : "";
        return `<label class="field">
        <span class="field-label">${label}${required ? '<span class="required">*</span>' : ""}</span>
        <input class="text-input" data-model-field="${type}" data-create-placeholder="${placeholder}" data-edit-value="${editValue}"${readOnly} placeholder="${placeholder}" autocomplete="off">
      </label>`;
      }

      function capabilitiesMarkup() {
        return `<div class="section-card">
        <h3 class="section-title">能力与模态</h3>
        <p class="section-description">只保留会影响模型选择和调用提示的能力标记。</p>
        <div class="token-block">
          <div class="token-label">模型类型</div>
          <div class="chip-group" style="margin-top:8px">
            <button class="chip is-selected" data-chip>文本</button>
            <button class="chip" data-chip>图片</button>
            <button class="chip" data-chip>嵌入</button>
            <button class="chip" data-chip>重排</button>
          </div>
        </div>
        <div class="token-block">
          <div class="token-label">模型能力</div>
          <div class="chip-group" style="margin-top:8px">
            <button class="chip is-selected" data-chip>推理</button>
            <button class="chip" data-chip>工具</button>
          </div>
        </div>
        <div class="token-block">
          <div class="token-label">输入模态</div>
          <div class="chip-group" style="margin-top:8px">
            <button class="chip" data-chip>视觉</button>
            <button class="chip" data-chip>音频</button>
            <button class="chip" data-chip>视频</button>
          </div>
        </div>
      </div>`;
      }

      function tokenCardMarkup(compact = false) {
        return `<div class="section-card">
        <h3 class="section-title">上下文与输出限制</h3>
        <p class="section-description">用于模型选择器提示和请求前校验，不改变供应商原始协议。</p>
        <div class="token-block">
          <div class="token-header"><span class="token-label">上下文窗口</span><div class="token-presets">
            <button class="token-preset" data-target="context" data-value="128K">128K</button>
            <button class="token-preset" data-target="context" data-value="200K">200K</button>
            <button class="token-preset" data-target="context" data-value="256K">256K</button>
            <button class="token-preset" data-target="context" data-value="1M">1M</button>
          </div></div>
          <input class="text-input token-input" data-model-field="context" data-edit-value="128K" data-create-placeholder="例如 128000" placeholder="例如 128000" autocomplete="off">
        </div>
        <div class="token-block">
          <div class="token-header"><span class="token-label">最大输入 Token</span><div class="token-presets">
            <button class="token-preset" data-target="input" data-value="128K">128K</button>
            <button class="token-preset" data-target="input" data-value="200K">200K</button>
            <button class="token-preset" data-target="input" data-value="256K">256K</button>
            <button class="token-preset" data-target="input" data-value="512K">512K</button>
          </div></div>
          <input class="text-input token-input" data-model-field="input" data-edit-value="128K" data-create-placeholder="例如 128000" placeholder="例如 128000" autocomplete="off">
        </div>
        <div class="token-block">
          <div class="token-header"><span class="token-label">最大输出 Token</span><div class="token-presets">
            <button class="token-preset" data-target="output" data-value="16K">16K</button>
            <button class="token-preset" data-target="output" data-value="32K">32K</button>
            <button class="token-preset" data-target="output" data-value="64K">64K</button>
            <button class="token-preset" data-target="output" data-value="128K">128K</button>
          </div></div>
          <input class="text-input token-input" data-model-field="output" data-edit-value="16K" data-create-placeholder="例如 65536" placeholder="例如 65536" autocomplete="off">
        </div>
      </div>`;
      }

      function runtimeCardMarkup() {
        return `<div class="section-card">
        <h3 class="section-title">运行时设置</h3>
        <p class="section-description">连接已经在供应商设置中配置，这里只展示模型级差异。</p>
        <div class="form-grid">
          <label class="field"><span class="field-label">请求协议</span><select class="text-input" data-model-field="protocol"><option>Chat Completions</option><option>Responses</option><option>自定义适配</option></select></label>
          <label class="field"><span class="field-label">默认温度</span><input class="text-input" value="0.7" data-model-field="temperature"></label>
        </div>
      </div>`;
      }

      function dialogHeader(kicker, titleId) {
        return `<header class="dialog-header">
        <div class="dialog-heading">
          <p class="dialog-kicker">${kicker}</p>
          <h1 class="dialog-title" id="${titleId}"><span class="mode-only-create">添加模型</span><span class="mode-only-edit">编辑模型</span></h1>
          <p class="dialog-helper"><span class="mode-only-create">填写最少信息即可先保存，更多能力可以之后补充。</span><span class="mode-only-edit">修改模型能力和限制，已有请求配置会保持不变。</span></p>
        </div>
        ${modeSwitch()}
        <button class="close-button" data-action="close" aria-label="关闭">×</button>
      </header>`;
      }

      function footerMarkup(kind) {
        return `<footer class="dialog-footer">
        <div class="footer-left">
          ${kind === "workbench" ? '<span class="save-dot"></span>' : ""}
          <span class="mode-only-create">新增后可继续编辑</span><span class="mode-only-edit">已同步到当前供应商</span>
        </div>
        <div class="footer-actions">
          <button class="danger-button mode-only-edit block" data-action="delete">删除模型</button>
          <button class="ghost-button" data-action="close">取消</button>
          <button class="primary-button" data-action="submit"><span class="mode-only-create">添加模型</span><span class="mode-only-edit">保存修改</span></button>
        </div>
      </footer>`;
      }

      function dialogFocused() {
        return `<div class="modal-layer">
        <div class="modal-scrim"></div>
        <section class="model-dialog" role="dialog" aria-modal="true" aria-labelledby="focused-title">
          ${dialogHeader("模型配置", "focused-title")}
          <div class="dialog-body">
            <div class="form-grid">
              ${fieldMarkup("id", "模型 ID", "例如 gpt-5.5", modelData.id, true, true)}
              ${fieldMarkup("name", "模型名称", "例如 GPT-5.5", modelData.name)}
            </div>
            <button class="disclosure" data-action="advanced" aria-expanded="false"><span>更多设置</span><span class="chevron"></span></button>
            <div class="advanced-content">
              ${capabilitiesMarkup()}
              ${tokenCardMarkup(true)}
            </div>
          </div>
          ${footerMarkup("focused")}
        </section>
      </div>
      <button class="ghost-button reopen-button" data-action="open">重新打开模型配置</button>`;
      }

      function dialogSections() {
        return `<div class="modal-layer">
        <div class="modal-scrim"></div>
        <section class="model-dialog" role="dialog" aria-modal="true" aria-labelledby="sections-title">
          ${dialogHeader("模型与供应商 / 当前供应商", "sections-title")}
          <div class="dialog-body">
            <section class="section-card">
              <h3 class="section-title">基础信息</h3>
              <p class="section-description">先定义这个模型在列表中的身份，模型直接挂在当前供应商下。</p>
              <div class="form-grid">
                ${fieldMarkup("id", "模型 ID", "例如 gpt-5.5", modelData.id, true, true)}
                ${fieldMarkup("name", "模型名称", "例如 GPT-5.5", modelData.name)}
              </div>
            </section>
            <button class="disclosure" data-action="advanced" aria-expanded="false"><span>更多设置</span><span class="chevron"></span></button>
            <div class="advanced-content">
              ${capabilitiesMarkup()}
              ${tokenCardMarkup()}
              ${runtimeCardMarkup()}
            </div>
          </div>
          ${footerMarkup("sections")}
        </section>
      </div>
      <button class="ghost-button reopen-button" data-action="open">重新打开模型配置</button>`;
      }

      function dialogWorkbench() {
        return `<div class="modal-layer">
        <div class="modal-scrim"></div>
        <section class="model-dialog" role="dialog" aria-modal="true" aria-labelledby="workbench-title">
          ${dialogHeader("模型工作台", "workbench-title")}
          <div class="dialog-body">
            <aside class="dialog-rail">
              <p class="rail-caption">编辑范围</p>
              <button class="rail-item active">基础信息</button>
              <button class="rail-item">能力与模态</button>
              <button class="rail-item">上下文限制</button>
              <button class="rail-item">运行时</button>
              <div class="rail-summary"><strong><span class="mode-only-create">新模型草稿</span><span class="mode-only-edit">GPT-5.5</span></strong><span><span class="mode-only-create">尚未连接到请求</span><span class="mode-only-edit">OpenAI Compatible</span></span></div>
            </aside>
            <div class="dialog-form">
              <div class="form-grid">
                ${fieldMarkup("id", "模型 ID", "例如 gpt-5.5", modelData.id, true, true)}
                ${fieldMarkup("name", "模型名称", "例如 GPT-5.5", modelData.name)}
              </div>
              <button class="disclosure" data-action="advanced" aria-expanded="false"><span>更多设置</span><span class="chevron"></span></button>
              <div class="advanced-content">
                ${capabilitiesMarkup()}
                ${tokenCardMarkup()}
                ${runtimeCardMarkup()}
              </div>
            </div>
          </div>
          ${footerMarkup("workbench")}
        </section>
      </div>
      <button class="ghost-button reopen-button" data-action="open">重新打开模型配置</button>`;
      }

      const variants = [
        () =>
          `<div class="prototype-scene variant-focused" data-mode="create" data-advanced="false" data-dialog-open="true">${appBackground()}${dialogFocused()}</div>`,
        () =>
          `<div class="prototype-scene variant-sections" data-mode="create" data-advanced="false" data-dialog-open="true">${appBackground()}${dialogSections()}</div>`,
        () =>
          `<div class="prototype-scene variant-workbench" data-mode="create" data-advanced="false" data-dialog-open="true">${appBackground()}${dialogWorkbench()}</div>`,
      ];

      const stage = document.getElementById("stage");
      const picker = document.querySelector(".proto-picker");
      const highlight = picker.querySelector(".proto-picker-highlight");
      const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
      const replay = picker.querySelector(".proto-picker-replay");
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + "px";
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = "";
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute("data-active", j === i);
          if (j === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set("v", i + 1);
        history.replaceState(null, "", url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
      replay?.addEventListener("click", () => mount(current));
      window.addEventListener("resize", moveHighlight);

      document.addEventListener("keydown", (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
        else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === "r" || e.key === "R") mount(current);
      });

      function syncMode(scene, mode) {
        scene.dataset.mode = mode;
        scene
          .querySelectorAll("[data-mode]")
          .forEach((button) => button.classList.toggle("is-active", button.dataset.mode === mode));
        scene.querySelectorAll("[data-model-field]").forEach((field) => {
          const key = field.dataset.modelField;
          const editValue = field.dataset.editValue;
          const createPlaceholder = field.dataset.createPlaceholder;
          if (mode === "edit") {
            if (editValue && field.tagName === "INPUT") field.value = editValue;
            field.placeholder = "";
            if (field.hasAttribute("data-edit-readonly")) field.readOnly = true;
          } else {
            if (field.tagName === "INPUT" && field.hasAttribute("data-edit-value")) field.value = "";
            field.placeholder = createPlaceholder || "";
            field.readOnly = false;
          }
          if (key === "protocol" || key === "temperature") return;
        });
      }

      function showToast(scene, message) {
        scene.querySelector(".toast")?.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        scene.appendChild(toast);
        window.setTimeout(() => toast.remove(), 1500);
      }

      stage.addEventListener("click", (event) => {
        const target = event.target.closest("button");
        if (!target || !stage.contains(target)) return;
        const scene = target.closest(".prototype-scene");
        if (!scene) return;

        if (target.dataset.mode) {
          syncMode(scene, target.dataset.mode);
          return;
        }
        if (target.dataset.action === "advanced") {
          const open = scene.dataset.advanced !== "true";
          scene.dataset.advanced = String(open);
          target.setAttribute("aria-expanded", String(open));
          return;
        }
        if (target.dataset.action === "close") {
          scene.dataset.dialogOpen = "false";
          return;
        }
        if (target.dataset.action === "open") {
          scene.dataset.dialogOpen = "true";
          return;
        }
        if (target.dataset.action === "submit") {
          showToast(scene, scene.dataset.mode === "edit" ? "已模拟保存模型修改" : "已模拟添加模型");
          return;
        }
        if (target.dataset.action === "delete") {
          showToast(scene, "已模拟删除模型");
          return;
        }
        if (target.dataset.chip !== undefined) {
          target.classList.toggle("is-selected");
          return;
        }
        if (target.dataset.target) {
          const input = scene.querySelector(`[data-model-field="${target.dataset.target}"]`);
          if (input) input.value = target.dataset.value;
        }
      });

      setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
    </script>
  </body>
</html>

<!doctype html>
<!--
  Desktop startup surface: the first document the app window paints, before the
  bundled server is ready. Self-contained on purpose — it must render with no
  workspace, no server, and no built app bundle.

  Colors mirror the classic palette (`--theme-bg`, `--theme-fg`, `--color-ink-650`),
  the mark is `Apps/Desktop/Assets/senera-icon.svg` path for path, and the motion is
  the same signal flow the app uses for live activity (`Frontend/src/index.css`).
  `Scripts/VerifyDesktopStartupSurface.ts` keeps those bindings honest, and
  `Frontend/src/app/StartupSurface.stories.tsx` previews this exact file.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senera</title>
    <style>
      :root {
        --startup-canvas: #f9fafb;
        --startup-content: #111827;
        --startup-secondary: #5f697a;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --startup-canvas: #111827;
          --startup-content: #f9fafb;
          --startup-secondary: #bac2cd;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --startup-canvas: #111827;
        --startup-content: #f9fafb;
        --startup-secondary: #bac2cd;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--startup-canvas);
        color: var(--startup-content);
        font:
          16px/1.45 "HarmonyOS Sans SC",
          "PingFang SC",
          "Microsoft YaHei UI",
          "Noto Sans CJK SC",
          "Segoe UI Variable",
          "Segoe UI",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }

      main {
        height: 100%;
        display: grid;
        place-items: center;
      }

      .startup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition:
          opacity 320ms cubic-bezier(0.23, 1, 0.32, 1),
          transform 320ms cubic-bezier(0.23, 1, 0.32, 1);
        @starting-style {
          opacity: 0;
          transform: scale(0.98);
        }
      }

      .mark {
        width: 72px;
        height: 72px;
        overflow: visible;
      }

      .mark__wave {
        fill: none;
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .mark__wave--violet {
        stroke: #7e67c2;
      }

      .mark__wave--gold {
        stroke: #f6cf52;
      }

      /* The full mark stays visible; the pulse only adds the live signal on top. */
      .mark__wave--base {
        opacity: 0.72;
      }

      .mark__wave--pulse {
        stroke-dasharray: 12 88;
        animation: startup-signal-flow 2.8s linear infinite;
      }

      .mark__dot {
        fill: #a3abb2;
      }

      .wordmark {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .status {
        font-size: 12.5px;
        color: var(--startup-secondary);
      }

      @keyframes startup-signal-flow {
        from {
          stroke-dashoffset: 0;
        }

        to {
          stroke-dashoffset: -100;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup {
          transition: none;
        }

        .mark__wave--base {
          opacity: 1;
        }

        .mark__wave--pulse {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="startup" role="status" aria-live="polite">
        <svg class="mark" viewBox="70 86 360 338" aria-hidden="true" focusable="false">
          <g transform="translate(0 5)">
            <path
              class="mark__wave mark__wave--violet mark__wave--base"
              d="M 90 280 C 115 280 130 280 142 262 C 152 240 162 220 172 220 C 182 220 193 240 200 275 C 206 298 210 310 216 310 C 222 310 234 260 242 210 C 247 180 248 163 251 163 C 254 163 255 180 260 210 C 268 260 280 345 311 345 C 324 345 334 325 344 295 C 354 268 370 280 410 280"
            />
            <path
              class="mark__wave mark__wave--gold mark__wave--base"
              d="M 132 282 C 145 285 156 296 168 315 C 185 340 198 395 226 395 C 255 395 272 315 290 255 C 302 215 312 203 322 203 C 333 203 348 235 362 278"
            />
            <path
              class="mark__wave mark__wave--violet mark__wave--pulse"
              pathLength="100"
              d="M 90 280 C 115 280 130 280 142 262 C 152 240 162 220 172 220 C 182 220 193 240 200 275 C 206 298 210 310 216 310 C 222 310 234 260 242 210 C 247 180 248 163 251 163 C 254 163 255 180 260 210 C 268 260 280 345 311 345 C 324 345 334 325 344 295 C 354 268 370 280 410 280"
            />
            <path
              class="mark__wave mark__wave--gold mark__wave--pulse"
              pathLength="100"
              d="M 132 282 C 145 285 156 296 168 315 C 185 340 198 395 226 395 C 255 395 272 315 290 255 C 302 215 312 203 322 203 C 333 203 348 235 362 278"
            />
            <circle class="mark__dot" cx="250" cy="118" r="23" />
          </g>
        </svg>
        <div class="wordmark">Senera</div>
        <div class="status">正在启动本地服务…</div>
      </div>
    </main>
    <script>
      // The desktop passes the localized title and status of the launch it is running;
      // the preview and any plain file:// open keep the defaults above.
      (() => {
        const params = new URLSearchParams(window.location.search);
        const title = params.get("title") || "Senera";
        const status = params.get("status");
        const locale = params.get("locale");
        document.title = title;
        document.querySelector(".wordmark").textContent = title;
        if (status) document.querySelector(".status").textContent = status;
        if (locale) document.documentElement.lang = locale;
      })();
    </script>
  </body>
</html>
